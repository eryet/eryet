name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate colorful snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#A06BFF&color_dots=#ebedf0,#ffd1ec,#ff9bd2,#ff6ac1,#d6339a
            dist/snake-dark.svg?palette=github-dark&color_snake=#3EC8F5&color_dots=#161b22,#5a2a6e,#8a3fb0,#c35bd8,#ff6ac1

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
